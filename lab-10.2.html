<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Slider using Z-Index</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Slider container */
        .slider {
            position: relative;
            width: 800px;
            height: 450px;
            margin: 50px auto;
            overflow: hidden;
            border-radius: 10px;
        }

        /* Images */
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Text on image */
        .text {
            position: absolute;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: white;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            text-align: center;

            z-index: 2;
        }

        .text h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .text p {
            font-size: 20px;
        }

        /* Different z-index for slides */
        .slide1 {
            z-index: 1;
        }

        .slide2 {
            z-index: 0;
        }

        .slide3 {
            z-index: -1;
        }

        /* Navigation buttons */
        .button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            background-color: rgba(0, 0, 0, 0.6);
            color: white;

            border: none;
            padding: 15px;
            font-size: 25px;

            cursor: pointer;
            z-index: 3;
        }

        .previous {
            left: 10px;
        }

        .next {
            right: 10px;
        }
    </style>
</head>

<body>

    <h1 style="text-align:center; margin-top:30px;">
        Image Slider using Z-Index
    </h1>

    <div class="slider">

        <!-- Slide 1 -->
        <div class="slide slide1">
            <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=600&quality=80">

            <div class="text">
                <h1>Beautiful Nature</h1>
                <p>Explore the beauty of nature</p>
            </div>
        </div>

        <!-- Slide 2 -->
        <div class="slide slide2">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7CBJorho6YGePkRtqPY5gj9l2RwFyfdqGTNlddvpwwLiN5b6RyrkbjMJo&s=10">

            <div class="text">
                <h1>Mountain View</h1>
                <p>Enjoy the amazing mountains</p>
            </div>
        </div>

        <!-- Slide 3 -->
        <div class="slide slide3">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKuMvPQXqxTXwNe8eBuFb9cz0IrP9hKV4g9qgdnOBY7w&s">

            <div class="text">
                <h1>Adventure</h1>
                <p>Discover new places</p>
            </div>
        </div>

        <!-- Buttons -->
        <button class="button previous">&#10094;</button>
        <button class="button next">&#10095;</button>

    </div>.slide1 {
        z-index: 1;
    }
    
    .text {
        z-index: 2;
    }
    
    .button {
        z-index: 3;
    }

</body>
</html>
