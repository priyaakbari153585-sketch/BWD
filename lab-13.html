<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Grid Table</title>

        <!--Bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
    </head>

    <body>

        <div class="container mt-5">
            <h2 class="text-center mb-4">Student Table</h2>

            <!--Table Header-->
            <div class="row bg-primary text-white fw-bold p-2">
                <div class="col">Roll No.</div>
                <div class="col">Name</div>
                <div class="col">Course</div>
                <div class="col">Marks</div>
            </div>

            <!--Row 1-->
            <div class="row border p-2">
                <div class="col">1</div>
                <div class="col">Priya</div>
                <div class="col">BCA</div>
                <div class="col">85</div>
            </div>

            <!--Row 2-->
            <div class="row border p-2">
                <div class="col">2</div>
                <div class="col">Tiya</div>
                <div class="col">BCA</div>
                <div class="col">90</div>
            </div>

            <!--Row 3-->
            <div class="row border p-2">
                <div class="col">3</div>
                <div class="col">Ananya</div>
                <div class="col">BCA</div>
                <div class="col">88</div>
            </div>

        </div>
        
    </body>
</html>
