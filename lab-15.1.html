
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Image Opacity Effect</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .my-image {
            opacity: 1;
            transition: opacity 0.5s;
        }

        .my-image:hover {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <div class="container text-center mt-5">

        <h1 class="mb-4">Image Opacity Effect</h1>

        <p class="lead">
            Move the mouse over the image
        </p>

        <img src="https://static.vecteezy.com/system/resources/thumbnails/049/855/347/small/nature-background-high-resolution-wallpaper-for-a-serene-and-stunning-view-photo.jpg"
             alt="Sample Image"
             class="img-fluid rounded shadow my-image">

    </div>

</body>
</html>
